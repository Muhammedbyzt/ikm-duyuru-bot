name: Günlük Bot Durum Bildirimi (Devre Dışı)

# Bot artık Render üzerinde çalışıyor, günlük bildirim de oradan geliyor.

on:
  workflow_dispatch: {}  # Sadece manuel tetikleme

jobs:
  durum:
    runs-on: ubuntu-latest
    steps:
      - name: Durum bildirimi gönder
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"$CHAT_ID\", \"text\": \"🤖 *İKM Duyuru Takip Botu Aktif!*\n\n✅ Bot sorunsuz çalışıyor.\n📡 Son 24 saatte site düzenli olarak kontrol edildi.\n⏰ Bir sonraki durum raporu: yarın 09:00\", \"parse_mode\": \"Markdown\"}"
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
