name: İKM Duyuru Takip

on:
  push:
    branches: [test]           # Test branch'ine push yapınca çalışsın
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  kontrol:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # git push için gerekli

    steps:
      - name: Repo'yu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt

      - name: Duyuruları kontrol et
        run: python takip.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gonderilen_duyurular.txt
          git diff --cached --quiet || git commit -m "Duyuru listesi güncellendi [skip ci]"
          git push
