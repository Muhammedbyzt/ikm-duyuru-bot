name: İKM Duyuru Takip (GitHub Actions - Devre Dışı)

# Bot artık Render üzerinde çalışıyor.
# Bu workflow sadece yedek olarak saklanıyor.
# Manuel çalıştırmak istersen "Run workflow" butonunu kullan.

on:
  workflow_dispatch: {}  # Sadece manuel tetikleme

jobs:
  kontrol:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Repo'yu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıkları yükle
        run: pip install requests beautifulsoup4

      - name: Duyuruları kontrol et
        run: python takip.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gonderilen_duyurular.txt
          git diff --cached --quiet || git commit -m "Duyuru listesi güncellendi [skip ci]"
          git push
